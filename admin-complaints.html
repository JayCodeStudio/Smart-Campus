<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Manage Complaints - Smart Campus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">
            Smart Campus Admin
        </div>

        <nav>
            <a href="admin-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>

    </header>


    <main>

        <h1>Complaint Management</h1>

        <p>View and manage student complaints.</p>


        <div class="student-table">

            <table>

                <thead>
                    <tr>
                        <th>Complaint ID</th>
                        <th>Student</th>
                        <th>Subject</th>
                        <th>Category</th>
                        <th>Details</th>
                        <th>Status</th>
                        <th>Action</th>
                    </tr>
                </thead>

                <tbody id="complaint-list">
                </tbody>

            </table>

        </div>

    </main>


    <script>

        // Demo complaints
        const demoComplaints = [
            {
                name: "Rahul Singh",
                subject: "Wi-Fi Issue",
                category: "Wi-Fi",
                message: "Internet not working",
                status: "Pending"
            },

            {
                name: "Ankit Kumar",
                subject: "Classroom Fan",
                category: "Classroom",
                message: "Fan is not working",
                status: "In Progress"
            },

            {
                name: "Priya Sharma",
                subject: "Library Timing",
                category: "Library",
                message: "Library timing issue",
                status: "Resolved"
            }
        ];


        // First time only: save demo complaints
        function setupDemoComplaints() {

            const existing =
                localStorage.getItem("complaints");

            if (!existing) {

                localStorage.setItem(
                    "complaints",
                    JSON.stringify(demoComplaints)
                );

            }

        }


        // Load all complaints
        function loadComplaints() {

            const complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            const list =
                document.getElementById("complaint-list");


            list.innerHTML = "";


            complaints.forEach(
                (complaint, index) => {

                    const row =
                        document.createElement("tr");


                    row.innerHTML = `

                        <td>
                            CMP${String(index + 1).padStart(3, "0")}
                        </td>

                        <td>
                            ${complaint.name || "Unknown"}
                        </td>

                        <td>
                            ${complaint.subject || "No Subject"}
                        </td>

                        <td>
                            ${complaint.category || "Other"}
                        </td>

                        <td>
                            ${complaint.message || "No Details"}
                        </td>

                        <td>

                            <select
                                onchange="saveStatus(
                                    ${index},
                                    this.value
                                )"
                            >

                                <option value="Pending"
                                    ${(!complaint.status ||
                                    complaint.status === "Pending")
                                    ? "selected"
                                    : ""}>
                                    Pending
                                </option>

                                <option value="In Progress"
                                    ${complaint.status === "In Progress"
                                    ? "selected"
                                    : ""}>
                                    In Progress
                                </option>

                                <option value="Resolved"
                                    ${complaint.status === "Resolved"
                                    ? "selected"
                                    : ""}>
                                    Resolved
                                </option>

                            </select>

                        </td>

                        <td>

                            <button
                                onclick="deleteComplaint(${index})"
                            >
                                Delete
                            </button>

                        </td>

                    `;


                    list.appendChild(row);

                }
            );

        }


        // Save status
        function saveStatus(index, status) {

            const complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            if (!complaints[index]) {
                return;
            }


            complaints[index].status =
                status;


            localStorage.setItem(
                "complaints",
                JSON.stringify(complaints)
            );


            alert(
                "Complaint status updated!"
            );

        }


        // Delete complaint
        function deleteComplaint(index) {

            const confirmDelete =
                confirm(
                    "Are you sure you want to delete this complaint?"
                );


            if (!confirmDelete) {
                return;
            }


            const complaints =
                JSON.parse(
                    localStorage.getItem("complaints")
                ) || [];


            if (!complaints[index]) {
                return;
            }


            complaints.splice(
                index,
                1
            );


            localStorage.setItem(
                "complaints",
                JSON.stringify(complaints)
            );


            alert(
                "Complaint deleted successfully!"
            );


            loadComplaints();

        }


        // Start
        setupDemoComplaints();

        loadComplaints();

    </script>

</body>

</html>
