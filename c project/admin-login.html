<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login - Smart Campus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="login-container">

        <div class="login-box">

            <h1>Admin Login</h1>
            <p>Smart Campus Administration</p>

            <form>

                <label for="admin-email">Admin Email</label>
                <input type="email" id="admin-email"
                    placeholder="Enter admin email">

                <label for="admin-password">Password</label>

                <div style="display: flex; gap: 8px;">

                    <input type="password" id="admin-password"
                        placeholder="Enter admin password"
                        style="margin-bottom: 20px;">

                    <button type="button" id="adminToggleBtn"
                        onclick="toggleAdminPassword()"
                        style="width: 70px; height: 42px; padding: 5px; margin-bottom: 20px;">
                        SHOW
                    </button>

                </div>

             <button type="button" onclick="adminLogin()">
                Login
             </button>
            </form>
        </div>

    </div>
    <script>

             function toggleAdminPassword() {

                const password = document.getElementById("admin-password");
                const toggleBtn = document.getElementById("adminToggleBtn");

                if (password.type === "password") {

                    password.type = "text";
                    toggleBtn.textContent = "HIDE";

                } else {

                    password.type = "password";
                    toggleBtn.textContent = "SHOW";

                }

            }

            function adminLogin() {

                const email = document.getElementById("admin-email").value;
                const password = document.getElementById("admin-password").value;

                if (email === "" || password === "") {
                    alert("Please enter admin email and password!");
                    return;
                }

                if (email === "admin@smartcampus.com" && password === "admin123") {
                    window.location.href = "admin-dashboard.html";
                } else {
                    alert("Invalid admin email or password!");
                }

            }

    </script>

</body>
</html>
