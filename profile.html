<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>My Profile - Smart Campus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>

        <div class="logo">Smart Campus</div>

        <nav>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>

    </header>

    <main>

        <h1>My Profile</h1>

        <p>Student information</p>
        <button onclick="showEditForm()">
        ✏️ Edit Profile
        </button>

        <div id="editForm" style="display: none; margin-top: 20px;">

            <input type="text" id="editName" placeholder="Enter your name">

            <br><br>

            <input type="email" id="editEmail" placeholder="Enter your email">

            <br><br>

            <button onclick="saveProfile()">💾 Save Profile</button>

        </div>

        <div class="student-table">

            <table>

                <tr>
                    <th>Name</th>
                    <td>Jay Singh</td>
                </tr>

                <tr>
                    <th>Student ID</th>
                    <td>STU004</td>
                </tr>

                <tr>
                    <th>Course</th>
                    <td>B.Tech CSE</td>
                </tr>

                <tr>
                    <th>Semester</th>
                    <td>7th Semester</td>
                </tr>

                <tr>
                    <th>Email</th>
                    <td>jaysingh895jay@gmail.com</td>
                </tr>

            </table>

        </div>

    </main>

        <script>

        function showEditForm() {
            document.getElementById("editForm").style.display = "block";
        }

        function saveProfile() {

            const name = document.getElementById("editName").value;
            const email = document.getElementById("editEmail").value;

            if (name === "" || email === "") {
                alert("Please fill all details!");
                return;
            }

            document.querySelector(".student-table tr:nth-child(1) td").textContent = name;

            document.querySelector(".student-table tr:nth-child(5) td").textContent = email;

            localStorage.setItem("profileName", name);
            localStorage.setItem("profileEmail", email);

            alert("Profile updated successfully!");
        }
            const savedName = localStorage.getItem("profileName");
            const savedEmail = localStorage.getItem("profileEmail");

            if (savedName) {
                document.querySelector(".student-table tr:nth-child(1) td").textContent = savedName;
            }

            if (savedEmail) {
                document.querySelector(".student-table tr:nth-child(5) td").textContent = savedEmail;
            }

        </script>
</body>

</html>
