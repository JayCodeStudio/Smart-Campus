<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Complaints - Smart Campus</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="logo">Smart Campus</div>

        <nav>
            <a href="student-dashboard.html">Dashboard</a>
            <a href="index.html">Home</a>
        </nav>
    </header>

    <main class="complaint-page">

        <h1>Complaint System</h1>
        <p>Submit your campus-related complaint</p>

        <div class="complaint-box">

            <form onsubmit="submitComplaint(event)">

                <label for="name">Student Name</label>
                <input type="text" id="name" placeholder="Enter your name">

                <label for="subject">Complaint Subject</label>
                <input type="text" id="subject" placeholder="Enter complaint subject">

                <label for="category">Category</label>
                <select id="category">
                    <option value="">Select Category</option>
                    <option>Hostel</option>
                    <option>Classroom</option>
                    <option>Library</option>
                    <option>Wi-Fi</option>
                    <option>Transport</option>
                    <option>Other</option>
                </select>

                <label for="message">Complaint Details</label>
                <textarea id="message" rows="5"
                    placeholder="Write your complaint here..."></textarea>

                <button type="submit">Submit Complaint</button>

            </form>

        </div>

    </main>
        <h2 style="margin-top: 40px;">My Complaints</h2>

            <div class="student-table">

                <table>

                    <thead>
                        <tr>
                            <th>Complaint ID</th>
                            <th>Subject</th>
                            <th>Category</th>
                            <th>Status</th>
                        </tr>
                    </thead>

                    <tbody id="myComplaints">
                    </tbody>

                </table>

            </div>

    <script>
       function submitComplaint(event) {
    event.preventDefault();

    const complaint = {
        name: document.getElementById("name").value,
        subject: document.getElementById("subject").value,
        category: document.getElementById("category").value,
        message: document.getElementById("message").value
    };

            const complaints = JSON.parse(localStorage.getItem("complaints")) || [];

            complaints.push(complaint);

            localStorage.setItem("complaints", JSON.stringify(complaints));

            alert("Complaint submitted successfully!");

            document.querySelector("form").reset();
        }

        const complaints = JSON.parse(localStorage.getItem("complaints")) || [];

        const myComplaintsTable = document.getElementById("myComplaints");

        complaints.forEach((complaint, index) => {

            const row = document.createElement("tr");

            row.innerHTML = `
                <td>CMP${String(index + 1).padStart(3, "0")}</td>
                <td>${complaint.subject}</td>
                <td>${complaint.category}</td>
                <td>${complaint.status || "Pending"}</td>
            `;

            myComplaintsTable.appendChild(row);

        });

    </script>

</body>
</html>
